<style>
:root{--bgi:#ffffff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#ffffff;--card:#ffffff;--ink:#23304a;--soft:#6b7690;--line:#f0dfb8;--ok:#1fa971;--bad:#e5484d;--sel:#c8f1ea}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b2236;--bgi:#1b2236;--card:#273050;--ink:#fff4d6;--soft:#aab4d0;--line:#3a4570;--sel:#1d5e57}}
:root[data-theme="dark"]{--bg:#1b2236;--bgi:#1b2236;--card:#273050;--ink:#fff4d6;--soft:#aab4d0;--line:#3a4570;--sel:#1d5e57}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bgi);background-attachment:fixed;color:var(--ink);font-family:'Cairo','Segoe UI',Tahoma,sans-serif}
#app{max-width:520px;margin:0 auto;padding:16px}
h1{background:linear-gradient(90deg,#ff3d81,#14b8a6,#2f80ed,#7c5cff);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:900;font-size:30px;margin:8px 0 4px;text-align:center}
.sub{text-align:center;color:var(--soft);margin:0 0 16px}
.stars{text-align:center;font-size:22px;margin-bottom:12px}
.unit{display:flex;align-items:center;gap:14px;width:100%;border:3px solid var(--c);background:var(--card);color:var(--ink);border-radius:22px;padding:14px;margin-bottom:12px;font:inherit;font-size:20px;font-weight:700;text-align:start;cursor:pointer}
.unit .e{font-size:40px;background:var(--c);border-radius:18px;width:64px;height:64px;display:grid;place-items:center;flex:none}
.unit small{display:block;font-weight:400;color:var(--soft);font-size:14px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.btn{font:inherit;font-weight:700;border:0;border-radius:16px;padding:10px 18px;background:#14b8a6;color:#fff;box-shadow:0 4px 0 #0e8f81;cursor:pointer;font-size:16px}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.q{box-shadow:0 5px 0 #b8e6df;background:var(--card);border-radius:24px;padding:20px;text-align:center;font-size:24px;font-weight:700;line-height:1.7;margin-bottom:14px;border:3px solid var(--line)}
.si{display:block;width:100%;max-width:300px;margin:0 auto 10px;border-radius:20px}
.nm{width:100%;font:inherit;font-size:24px;text-align:center;padding:14px;border-radius:18px;border:3px solid #ff7eb6;background:var(--card);color:var(--ink);margin-bottom:12px}
.fl{position:fixed;top:-40px;font-size:38px;animation:fl 1.6s ease-in forwards;pointer-events:none;z-index:9}
@keyframes fl{to{transform:translateY(110vh) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.fl{display:none}}
.opt.tf{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:28px;border-radius:26px;padding:16px 8px;box-shadow:0 5px 0 rgba(0,0,0,.12)}
.opt.tfy:not(.ok):not(.bad){background:#e8fbf1;border-color:#1fa971;color:#0f7a4e}
.opt.tfn:not(.ok):not(.bad){background:#ffecec;border-color:#e5484d;color:#b42318}
.opt.ok svg circle,.opt.bad svg circle{fill:#fff}.opt.ok svg path{stroke:#1fa971}.opt.bad svg path{stroke:#e5484d}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:10px}.nav .btn{flex:1;background:#14b8a6;box-shadow:0 4px 0 #0e8f81}
.btn.sh{background:#14b8a6;box-shadow:0 4px 0 #0e8f81}
.opt.l:not(.sel):not(.bad){border-color:#4cc9f0}
.opt.rr:not(.sel):not(.bad):not(.placed){border-color:#a78bfa}
.cg{display:flex;flex-wrap:wrap;justify-content:center;gap:18px;padding:8px 0 24px}
.cc{position:relative;width:150px;height:150px;border-radius:50%;border:0;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.45),transparent 48%),var(--c);color:#fff;font:inherit;font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;box-shadow:0 8px 0 rgba(0,0,0,.2),0 16px 24px rgba(0,0,0,.15);animation:pop .6s cubic-bezier(.34,1.56,.64,1) var(--d) both,bob var(--f) ease-in-out calc(var(--d) + .7s) infinite alternate;transition:transform .2s}
.cc:active{transform:scale(.92)}
.ce{font-size:46px;line-height:1}.cn{font-size:17px;line-height:1.2;padding:0 12px;text-shadow:0 1px 3px rgba(0,0,0,.3)}.cc small{font-size:12px;opacity:.95}
.ck{position:absolute;top:-6px;right:8px;font-size:32px;font-style:normal}
.ul{display:block}.ul .unit{animation:pop .5s cubic-bezier(.34,1.4,.64,1) var(--d,0s) both}
#app>*{animation:fin .32s ease both}
@keyframes fin{from{opacity:0;transform:translateY(12px)}}
@keyframes pop{from{opacity:0;transform:scale(.4) translateY(30px)}}
@keyframes bob{to{transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){.cc,.ul .unit,#app>*{animation:none!important}}
.vr{margin-top:14px;text-align:center}.vr .nm{font-size:15px;padding:10px;margin-bottom:8px}
.stc{font-size:14px}
.cim{width:78px;height:78px;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.25)}
.unit .e.pe{padding:0;overflow:hidden}.e.pe.pq{background:none!important;overflow:visible;box-shadow:none!important}.e.pe.pq img{object-fit:contain;transform:scale(1.35)}.ct{font-size:24px}.tq.th{height:1.9em;width:1.9em;border-radius:50%;border:2px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,.25)}.tq{height:2.4em;width:auto;vertical-align:middle;margin-left:4px}.e.pe.pc{background:none!important;border-radius:50%;border:4px solid #e11d2e;box-sizing:border-box;box-shadow:0 2px 6px rgba(225,29,46,.3)}.e.pe.pc img{border-radius:50%}.unit .e.pe img{width:100%;height:100%;object-fit:cover}
.ex{width:100%;border-radius:18px;display:block;cursor:zoom-in}
.car{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.car .ex{flex:0 0 100%;scroll-snap-align:center}
#cct{font-size:24px;font-weight:900;font-family:'Cairo','Segoe UI',Tahoma,sans-serif;background:var(--card);border:2px solid var(--line);border-radius:99px;padding:4px 20px;line-height:1.4}
#cct b,.qn b{display:inline-block;font-weight:900;animation:pop .35s}
.qn b{font-size:19px}
.cnav{display:flex;align-items:center;justify-content:space-between;margin-top:10px;font-size:16px;font-weight:700}
.cnav .btn{padding:8px 22px}
.lb{position:fixed;inset:0;background:rgba(255,255,255,.55);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.lbc{position:relative;background:#fff;border-radius:22px;padding:12px;width:100%;max-width:496px;max-height:82vh;max-height:82dvh;overflow:auto;box-shadow:0 8px 30px rgba(0,0,0,.22);border:2px solid #eee}
.lb img{width:100%;height:auto;max-height:calc(82dvh - 24px);display:block;object-fit:contain;margin:0 auto}
.lbx{position:absolute;top:8px;left:8px;z-index:61;width:44px;height:44px;background-color:#fff;border-radius:50%}
.cap{font-size:22px;font-weight:900;color:#14b8a6;margin:-6px 0 10px}
.qn{text-align:center;font-size:14px;font-weight:700;color:var(--soft);margin:-2px 0 4px}
.opt.gone{opacity:0;pointer-events:none;transition:opacity .4s}
.opt.placed{background:var(--ok);color:#fff;border-color:var(--ok);pointer-events:none}
.ph{background:#fff;color:#0f7a4e;border-radius:12px;padding:4px 8px;margin-bottom:6px;font-size:.8em}
.hand{position:relative;max-width:290px;margin:6px auto 14px}.hi{width:100%;display:block}
.fg{position:absolute;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;border:3px solid #14b8a6;background:#fff;color:#14b8a6;font:inherit;font-weight:900;font-size:22px;cursor:pointer;padding:0;display:grid;place-items:center}
.fg.sel{background:#ffe08a}.fg.placed{width:78px;height:78px;border:0;background:none;pointer-events:none}
.fg.placed img{width:78px;height:78px;object-fit:contain}
.fg .nb{position:absolute;top:-2px;right:-2px;width:28px;height:28px;border-radius:50%;background:#1fa971;color:#fff;font-size:16px;display:grid;place-items:center}
.stks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stk{background:#fff;border:3px solid var(--line);border-radius:18px;padding:4px;cursor:pointer}.stk img{width:100%;display:block}
.stk.sel{border-color:#14b8a6;background:#ffe08a}.stk.gone{opacity:0;pointer-events:none}
.bd{display:inline-grid;place-items:center;width:1.6em;height:1.6em;border-radius:50%;background:#fff;color:#1fa971;margin-inline-end:6px}.btn:disabled{opacity:.35;box-shadow:none}

.bl{color:#14b8a6}
.mi{height:90px;max-width:100%;object-fit:contain;border-radius:14px;display:block;margin:0 auto}
.th{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:10px;z-index:20;width:32px;height:32px;border-radius:50%;border:2px solid var(--line);background:var(--card);font-size:22px;cursor:pointer}
.ut{font-weight:900;font-size:16px;text-align:center;flex:1;padding:0 6px}
.unit{position:relative}.unit.dn{border-color:#1fa971}.unit.dn::after{content:'✅';position:absolute;top:-12px;inset-inline-start:-6px;font-size:34px}
.big{font-size:80px;line-height:1.1}
.opt{display:block;width:100%;font:inherit;font-size:22px;font-weight:700;padding:16px;margin-bottom:10px;border-radius:18px;border:3px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.opt.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.bad{background:var(--bad);color:#fff;border-color:var(--bad);animation:sh .3s}
.opt:nth-child(3n+1){border-color:#ff7eb6}.opt:nth-child(3n+2){border-color:#4cc9f0}.opt:nth-child(3n){border-color:#7bd88f}
.opt.sel{background:var(--sel);border-color:#14b8a6}
.opt.done{background:var(--ok);color:#fff;border-color:var(--ok);opacity:.55;pointer-events:none}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tf{font-size:30px;padding:20px}
.say{background:none;border:0;font-size:30px;cursor:pointer}
.msg{text-align:center;font-size:26px;font-weight:700;min-height:40px;margin:8px 0}
.end{text-align:center;padding-top:30px}
.end .big{font-size:96px}
@keyframes sh{25%{transform:translateX(8px)}75%{transform:translateX(-8px)}}
@media (prefers-reduced-motion:reduce){.opt.bad{animation:none}}
button:focus-visible{outline:4px solid #3b82f6;outline-offset:2px}
:root{--pg:#fdf6e3;--gold:#b8892b;--mk:#1b1b1b;--hd:#f6e7bd}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pg:#2d2a22;--mk:#f5ecd2;--hd:#4a3f22}}
.mp{background:var(--pg);color:var(--mk);border:4px double var(--gold);border-radius:10px;padding:14px 12px;box-shadow:0 0 0 6px var(--pg),0 0 0 8px var(--gold);margin:10px 8px 18px}
.mh,.bs,.mt{font-family:'Amiri Quran','Scheherazade New','Traditional Arabic',serif}
.mh{text-align:center;font-size:26px;border:2px solid var(--gold);border-radius:30px;padding:2px 8px;margin-bottom:10px;background:var(--hd)}
.bs{text-align:center;font-size:26px;margin:6px 0 8px}
.mt{text-align:justify;text-align-last:center;font-size:28px;line-height:2.5}
.ay{cursor:pointer;border-radius:8px}
.ay.on{background:rgba(224,168,0,.35)}
.no{display:inline-grid;place-items:center;width:1.7em;height:1.7em;border:2px solid var(--gold);border-radius:50%;font-size:.5em;margin:0 .3em;font-family:sans-serif;vertical-align:middle;color:var(--gold)}
.note{color:var(--soft);font-size:14px;text-align:center;margin:8px 0}
.cc.ci{background:none;box-shadow:none;width:156px;height:156px;padding:0;overflow:visible}
.cc.ci .cat{width:100%;height:100%;display:block;filter:none;pointer-events:none}
.cc.ci .ck{top:-2px;right:2px}
.cc.ci .cnt{position:absolute;left:50%;top:84%;transform:translate(-50%,-50%);width:47%;height:13%;display:flex;align-items:center;justify-content:center;background:#a36201;color:#fff8e1;border-radius:99px;font-size:13px;font-weight:900;line-height:1;white-space:nowrap;pointer-events:none}

/* ===== شاشة الاسم (الواجهة الأولى) ===== */
.wl{position:relative;overflow:hidden;min-height:calc(100vh - 40px);min-height:calc(100dvh - 40px);display:flex;flex-direction:column;justify-content:center;gap:16px;padding:46px 18px 96px;background:#fcfbf7;border-radius:30px;box-shadow:0 0 0 3px #efe9da,0 10px 30px rgba(0,0,0,.08);font-family:'Cairo','Segoe UI',Tahoma,sans-serif;color:#4a4a5e;text-align:center}
.wl>*{position:relative;z-index:1}
.wlc{position:absolute!important;inset:0;z-index:0!important;pointer-events:none}
.wlc i{position:absolute;display:block;opacity:.85}
.wlc i.d{width:9px;height:9px;border-radius:50%}
.wlc i.p{width:16px;height:7px;border-radius:6px}
.wo{position:absolute!important;width:46px;height:46px;opacity:.8;z-index:0!important;pointer-events:none}
.wo svg,.wst svg,.wlbk svg{width:100%;height:100%;display:block}
.wo.o1{top:19%;left:6%;width:38px;height:38px}.wo.o2{top:30%;right:5%}.wo.o3{top:52%;left:4%;width:34px;height:34px;opacity:.6}.wo.o4{bottom:20%;right:5%;width:40px;height:40px;opacity:.7}
.wlh{margin:0;font-size:46px;font-weight:900;line-height:1.25;color:#62bcff;background:none;-webkit-text-fill-color:#62bcff;text-shadow:-2px -2px 0 #1c60b5,2px -2px 0 #1c60b5,-2px 2px 0 #1c60b5,2px 2px 0 #1c60b5,0 -3px 0 #1c60b5,0 5px 0 #1c60b5,-3px 0 0 #1c60b5,3px 0 0 #1c60b5,0 8px 10px rgba(28,96,181,.25)}
.wls{margin:6px 0 4px;font-size:24px;font-weight:800;color:#4a4a5e}
.wli{border:3px solid #b86aa8;border-radius:32px;background:#fff;padding:9px;box-shadow:0 4px 0 #e9c3dd}
.wn{display:block;width:100%;font:inherit;font-size:30px;font-weight:800;text-align:center;color:#4a4a5e;background:#fff;border:3px dashed #f4a1c4;border-radius:24px;padding:20px 10px;outline:none}
.wn::placeholder{color:#6a6a7e;opacity:1}
.wn:focus{border-color:#e0699f;background:#fff9fc}
.wlnote{margin:2px 0 6px;font-size:16px;font-weight:700;color:#4a4a5e}
.wlgo{position:relative;display:flex;align-items:center;justify-content:center;gap:14px;width:100%;font:inherit;font-size:34px;font-weight:900;color:#fff;cursor:pointer;padding:12px 16px;border-radius:36px;border:3px solid #1b7a4c;background:linear-gradient(#a4e8b8,#74d196);box-shadow:0 7px 0 #3a9a6a,0 14px 18px rgba(27,122,76,.2);text-shadow:-2px -2px 0 #1b7a4c,2px -2px 0 #1b7a4c,-2px 2px 0 #1b7a4c,2px 2px 0 #1b7a4c,0 -2px 0 #1b7a4c,0 3px 0 #1b7a4c;transition:transform .08s,box-shadow .08s}
.wlgo::before{content:"";position:absolute;top:9px;left:18px;width:34px;height:12px;border-radius:50%;background:rgba(255,255,255,.7);transform:rotate(-12deg)}
.wlgo:active{transform:translateY(5px);box-shadow:0 2px 0 #3a9a6a}
.wlbk{width:54px;height:60px;flex:none;filter:drop-shadow(0 3px 0 rgba(27,122,76,.35))}
.wst{position:absolute!important;bottom:14px;width:78px;height:78px;z-index:1;animation:wlb 2.6s ease-in-out infinite alternate;pointer-events:none}
.wst.s1{left:12px}.wst.s2{right:12px;animation-delay:.8s}
@keyframes wlb{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-8px) rotate(6deg)}}
@media (prefers-reduced-motion:reduce){.wst{animation:none}}
.ib{width:58px;height:58px;flex:none;border:0;padding:0;background:center/contain no-repeat;cursor:pointer;filter:drop-shadow(0 3px 3px rgba(0,0,0,.18));transition:transform .15s}
.ib:active{transform:scale(.9)}

const IC_MOON='<svg viewBox="0 0 24 24" width="26" height="26"><path d="M20 14.5A8.5 8.5 0 119.5 4a7 7 0 0010.5 10.5z" fill="#fff6c8" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/></svg>',IC_SUN='<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4.6" fill="#fff6c8"/><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5.3 5.3L7 7M17 17l1.7 1.7M5.3 18.7L7 17M17 7l1.7-1.7"/></svg>',IC_RS='<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 11-2.6-5.9"/><path d="M20 3.5v4.6h-4.6" /></svg>';
function setTh(t){TH=t;document.documentElement.setAttribute('data-theme',t);tb.className='th '+(t==='dark'?'sun':'moon');document.querySelectorAll('.ic-th').forEach(b=>{b.className='ic ic-th'+(t==='dark'?' sun':'')+(b.classList.contains('wlth')?' wlth':'');b.setAttribute('aria-label',t==='dark'?'الوضع النهاري':'الوضع الليلي');b.innerHTML=(t==='dark'?IC_SUN:IC_MOON)+(b.classList.contains('wlth')?'':'<small>'+(t==='dark'?'نهاري':'ليلي')+'</small>')});try{localStorage.setItem('th',t)}catch(e){}}

const IC_SPK='<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z" fill="#fff"/><path d="M15.5 9a4.2 4.2 0 010 6M18 6.5a8 8 0 010 11"/></svg>',IC_SPKX='<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z" fill="#fff"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>';
function setMute(m){MUTED=m;QV=false;try{localStorage.setItem('mute',m?'1':'0');localStorage.setItem('qv','0')}catch(e){}if(m){try{speechSynthesis.cancel()}catch(e){}try{CUR&&CUR.pause()}catch(e){}}
 document.querySelectorAll('.ic-mu').forEach(b=>{b.classList.toggle('off',m);b.setAttribute('aria-label',m?'تشغيل الصوت':'إلغاء الصوت');b.innerHTML=m?IC_SPKX:IC_SPK});try{window.SPUPD&&window.SPUPD()}catch(e){}}
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('.ic-mu');if(b)setMute(!MUTED)});
setTh(TH);

NAME?home():ask();

/* ===== صوت الكليك (أول صوت من الملف الصوتي) ===== */
const CLICK_SRC=D(105);
const CLICK_SEL='#go,.cc,.unit,.pill.bl,.ib.pv,.ib.nx,.top .ib.home';
document.addEventListener('click',e=>{
 const b=e.target.closest&&e.target.closest(CLICK_SEL);
 if(!b||b.disabled||MUTED)return;
 try{const a=new Audio(CLICK_SRC);a.volume=1;a.play().catch(()=>{})}catch(err){}
},true);

/* زرار الرجوع في الموبايل */
(function(){
 const st=document.createElement('style');
 st.textContent='.xd{position:fixed;inset:0;background:rgba(255,255,255,.6);z-index:90;display:flex;align-items:center;justify-content:center;padding:20px}.xc{background:var(--card,#fff);color:var(--ink,#23304a);border:2px solid var(--line,#f0dfb8);border-radius:24px;padding:22px 20px 18px;width:100%;max-width:340px;text-align:center;box-shadow:0 10px 34px rgba(0,0,0,.25);font-family:inherit}.xc h2{margin:0 0 6px;font-size:21px}.xc p{margin:0 0 16px;color:var(--soft,#6b7690);font-size:16px}.xr{display:flex;gap:10px}.xr .btn{flex:1}.xr .xn{background:#e5484d;box-shadow:0 4px 0 #b83539}.rwb{display:flex;justify-content:center;margin:26px 0 12px}.rws{width:min(320px,86%);font-size:19px;background:linear-gradient(180deg,#a78bfa,#7c3aed)!important;color:#fff!important;box-shadow:0 5px 0 #5b21b6!important}';
 document.head.appendChild(st);
 window.exitAsk=function(yes,o){o=o||{};
  if(document.querySelector('.xd'))return;
  const d=document.createElement('div');d.className='xd';d.setAttribute('role','dialog');
  d.innerHTML='<div class="xc"><h2>'+(o.t||'هتقفل التطبيق؟')+'</h2><p>'+(o.m||'متأكد إنك عايز تقفل التطبيق؟')+'</p><div class="xr"><button class="btn xs">لا، أكمّل</button><button class="btn xn">'+(o.y||'أيوه، اقفل')+'</button></div></div>';
  document.body.appendChild(d);
  d.querySelector('.xs').onclick=()=>d.remove();
  d.querySelector('.xn').onclick=()=>{d.remove();yes()};
  d.onclick=e=>{if(e.target===d)d.remove()};
 };
 let SCR=null,EXITING=false;window.setScr=v=>{SCR=v};
 const _h=home,_c=catScreen,_m=catMenu,_p=play;
 home=function(){SCR={t:'home'};return _h.apply(this,arguments)};
 catScreen=function(ci){SCR={t:'cat',ci:ci};return _c.apply(this,arguments)};
 catMenu=function(ui){SCR={t:'menu',ui:ui};return _m.apply(this,arguments)};
 play=function(ui){SCR={t:'play',ui:ui};return _p.apply(this,arguments)};
 let depth=0;
 const arm=()=>{if(EXITING||depth>=8)return;try{while(depth<8){history.pushState({a:1},'');depth++}}catch(e){}};
 ['pointerdown','touchstart','click','keydown'].forEach(ev=>document.addEventListener(ev,arm,true));
 window.addEventListener('popstate',()=>{
  if(EXITING)return;
  if(depth>0)depth--;
  const rvx=document.getElementById('rvx');if(rvx){rvx.click();return}const xd=document.querySelector('.xd');if(xd){xd.remove();return}const lb=document.querySelector('.lb');if(lb){lb.remove();return}
  if(SCR&&SCR.t==='play'){goBack(SCR.ui)}
  else if(SCR&&SCR.t==='menu'){catScreen(CI(SCR.ui))}
  else if(SCR&&SCR.t==='cat'){home()}
  else{exitAsk(()=>{const out=()=>{EXITING=true;history.go(-(depth+1))};if(canRate()){markRateAsked();feedback(out,true)}else out()})}
 });
})();
</script>
